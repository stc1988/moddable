<!DOCTYPE html>
<html>
<body>
<header>Welcome to provisioning!</header>

<pre id="log"></pre>

<script>
function log(...args) {
	document.getElementById("log").textContent += args.join(" ") + "\n";
}
const socket = new WebSocket("ws://" + location.host + "/ws");
log("WebSocket Created");
socket.addEventListener("open", () => {
	log("Connected");
	socket.send(JSON.stringify({event: "scan"}));
	socket.send(JSON.stringify({event: "timezone", time: Date.now(), ...getTimeZoneOffsets()}));
	socket.send(JSON.stringify({event: "language", language: navigator.language}));
});
socket.addEventListener("message", event => {
	const msg = JSON.parse(event.data);
	log("Received:", JSON.stringify(msg, undefined, "  "));
	if ("scan" === msg.event) {
		socket.send(JSON.stringify({
			event: "connect",
			SSID: "MY SSID",
			password: "MY PASSWORD"
		}));
	}
	else if (("status" === msg.event) && ("provisioned" === msg.phase)) {
		log("Provisioning complete!");
		socket.send(JSON.stringify({event: "terminate"}));
	}
});
socket.addEventListener("close", event => {
	log("Disconnected:", event.code);
});
socket.addEventListener("error", event => {
	log("Error:", event.type);
});

function getTimeZoneOffsets(now = new Date()) {
    const year = now.getFullYear();
    const standard = Math.max(
        (new Date(year, 0, 1)).getTimezoneOffset(),
        (new Date(year, 6, 1)).getTimezoneOffset()
    );
    return {
        timezone: -standard * 60,
        dst: (standard - now.getTimezoneOffset()) * 60
    };
}
</script>
</body>
</html>
